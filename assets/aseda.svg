  </defs>
  <!-- headset band (open ring) -->
  <path d="M 30 90 A 70 70 0 1 1 170 90" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
  <path d="M 30 90 A 70 70 0 0 0 100 160" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
  <!-- ear cups -->
  <ellipse cx="32" cy="84" rx="15" ry="20" fill="#FF6B4A"/>
  <ellipse cx="168" cy="84" rx="15" ry="20" fill="#FF6B4A"/>
