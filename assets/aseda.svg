<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 8 190 172">
  <defs>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DCE3"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" x2="1">
      <stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#3B82F6"/>
