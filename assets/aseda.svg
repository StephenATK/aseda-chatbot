  <circle cx="100" cy="90" r="56" fill="url(#head)"/>
  <!-- visor + eyes -->
  <rect x="58" y="60" width="84" height="42" rx="21" fill="url(#visor)"/>
  <circle cx="80" cy="81" r="9" fill="#9F3A4E"/>
  <circle cx="120" cy="81" r="9" fill="#9F3A4E"/>
  <!-- smile -->
  <path d="M 88 112 Q 100 128 112 112 Z" fill="#E11D63"/>
  <!-- mic -->
